name: CI - paymentModule

on:
 push:
  branches: [master]
 pull_request:
   branches: [master]

jobs:
 build-and-test:
  runs-on: ubuntu-latest

  steps:
   - name: Checkout code   # Downloads your code from GitHub onto the runner machine
     uses: actions/checkout@v4
   - name: Setup .NET      #Install .net runtime on the runner machine
     uses: actions/setup-dotnet@v4
     with:
      dotnet-version: '8.0.x'

   - name: Setup Node.js   # Installs Node 20 on the runner       
     uses: actions/setup-node@v4
     with:
        node-version: '20.x'

   - name: Restore dependencies   # Runs dotnet restore - downloads all NuGet packages
     run: dotnet restore PaymentModule.sln

   - name: Build  #Compiles your C# code + builds Angular frontend
     run: dotnet build PaymentModule.sln --no restore --configuration Release

   - name: Run tests  # Runs your test cases,fails the pipeline if any test fails
     run: dotnet test PaymentModule.sln --no-build --configuration Release

   - name: Build Docker image  # Packages the app into a Docker container
     run: docker compose build
   
   
